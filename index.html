<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06111e"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>JARVIS AIR</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 25%,#103650,#030914 65%);color:#bfefff;font:16px system-ui;min-height:100dvh;display:flex;align-items:center;justify-content:center}.app{width:min(100%,480px);padding:30px 22px;text-align:center}h1{letter-spacing:.4em;font-size:32px;color:#6bdfff;margin:0}small{letter-spacing:.25em;color:#70a6c3}.orb{width:210px;height:210px;margin:45px auto;border:4px solid #32d7ff;border-radius:50%;box-shadow:0 0 40px #00bfff88,inset 0 0 35px #00bfff55;display:grid;place-items:center;animation:pulse 3s infinite}.orb:before{content:'';width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,#fff,#7feaff 30%,#0679aa 65%,#042d49);box-shadow:0 0 30px #17caff}@keyframes pulse{50%{box-shadow:0 0 70px #00bfff,inset 0 0 45px #00bfff}}button{background:#057da9;border:1px solid #42d8ff;border-radius:12px;color:white;padding:14px 20px;font:inherit;margin:5px;cursor:pointer}button:disabled{opacity:.5}#status{color:#72e2ff;min-height:28px}#log{margin-top:25px;text-align:left;background:#061829;border:1px solid #154962;border-radius:14px;padding:16px;min-height:130px;white-space:pre-wrap;line-height:1.5}input{width:100%;border:1px solid #25769b;border-radius:10px;background:#081d2f;color:white;padding:14px;font:inherit;margin:12px 0}.note{font-size:12px;color:#8caebe;margin-top:20px}</style></head><body><main class="app"><h1>JARVIS</h1><small>AIR • VOICE ASSISTANT</small><div class="orb" aria-hidden="true"></div><p id="status">SYSTEM READY</p><button id="talk">🎤 Talk to JARVIS</button><button id="stop">Stop</button><input id="typed" placeholder="Or type a command..." aria-label="Command"><button id="send">Send command</button><div id="log" aria-live="polite">JARVIS: Ready to assist.</div><p class="note">Microphone recognition depends on browser support. Tap Talk each time you want to speak.</p></main><script src="app.js"></script></body></html>
